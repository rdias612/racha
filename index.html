<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Racha Gragoatá</title>
    <meta name="theme-color" content="#12100d" />
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('racha_tema');
          var tema = salvo === 'light' || salvo === 'dark' ? salvo : 'dark';
          if (tema === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', tema === 'dark' ? '#12100d' : '#f3efe4');
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Racha" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..700;1,400..700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Chivo+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- iOS Startup Images / Splash Screens -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-light.svg"
      media="(prefers-color-scheme: light)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
