<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sem Conexão — Racha Gragoatá</title>
  <style>
    :root {
      --cor-primaria: #15803d;
      --cor-bg: #0a0a0a;
      --cor-texto: #f5f5f5;
      --cor-subtexto: #a3a3a3;
      --cor-card: #171717;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      background-color: var(--cor-bg);
      color: var(--cor-texto);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: var(--cor-card);
      border: 1px solid #262626;
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: var(--cor-subtexto);
      margin: 0 0 1.5rem;
      line-height: 1.4;
    }
    button {
      background-color: var(--cor-primaria);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 44px;
    }
    button:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚽</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar à rede. Verifique sua conexão 3G/4G ou Wi-Fi para acessar o racha.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
