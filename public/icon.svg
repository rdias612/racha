<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0d0d0e"/>
  <!-- Escudo partido duotônico Preto vs Branco -->
  <g transform="translate(0, 10)">
    <!-- Escudo base -->
    <path d="M256 50 L100 110 V250 C100 360 170 440 256 465 C342 440 412 360 412 250 V110 Z" fill="#1b1814" stroke="#ffb300" stroke-width="8"/>
    <!-- Metade esquerda preta -->
    <path d="M256 50 L100 110 V250 C100 360 170 440 256 465 Z" fill="#0d0d0e"/>
    <!-- Metade direita branca/giz -->
    <path d="M256 50 L412 110 V250 C412 360 342 440 256 465 Z" fill="#f4f1e8"/>
    <!-- Linha divisória vertical -->
    <line x1="256" y1="50" x2="256" y2="465" stroke="#35302a" stroke-width="4"/>
    
    <!-- Bola clássica central com estrela âmbar -->
    <circle cx="256" cy="250" r="70" fill="#12100d" stroke="#ffb300" stroke-width="6"/>
    <!-- Estrela âmbar de craque / vitória -->
    <polygon points="256,205 271,238 307,243 280,268 287,304 256,286 225,304 232,268 205,243 241,238" fill="#ffb300"/>
  </g>
</svg>